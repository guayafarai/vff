<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerFutbol</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="bar" id="bar">Reproductor</div>
    <div class="match-box" id="match-box" hidden>
      <div class="match-time" id="match-time"></div>
      <div class="match-info">
        <div><span class="tournament" id="tournament"></span><span id="match-name"></span></div>
        <span class="channels" id="channels"></span>
      </div>
    </div>
    <div id="options"></div>
    <div class="player vacio" id="player"><div class="state">Cargando transmisión...</div></div>
    <div class="actions">
      <a class="btn sec" href="index.html">← Volver a la agenda</a>
      <button class="btn" id="reload" type="button">Recargar reproductor</button>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script src="assets/player.js"></script>
</body>
</html>
