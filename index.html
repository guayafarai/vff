<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerFutbol</title>
  <meta name="description" content="VerFutbol: agenda deportiva diaria con horarios, torneos y canales de transmisión.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Buscar equipo, torneo o canal..." aria-label="Buscar partidos">
    </div>
    <div class="bar" id="agenda-date">Agenda de Partidos</div>
    <div id="matches-list"><div class="state">Cargando agenda...</div></div>
  </main>

  <noscript><div class="state">VerFutbol necesita JavaScript para mostrar la agenda.</div></noscript>
  <script src="assets/app.js"></script>
  <script src="assets/home.js"></script>
</body>
</html>
