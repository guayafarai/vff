<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fútbol Libre</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #fff; color: #333; }
    .header { text-align: center; padding: 25px 10px 15px; }
    .header h1 { color: #0d7338; font-size: 2.5rem; margin: 0 0 15px; }
    .header p { max-width: 950px; margin: 0 auto 10px; font-size: .92rem; line-height: 1.4; }
    .agenda-container { max-width: 950px; margin: 20px auto; padding: 0 10px; }
    .toolbar { margin-bottom: 10px; }
    .toolbar input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: .95rem; }
    .agenda-header { background: #12823e; color: #fff; text-align: center; padding: 10px 15px; font-weight: bold; border-radius: 6px 6px 0 0; }
    .match-row { display: flex; align-items: center; flex-wrap: wrap; padding: 11px 15px; border-bottom: 1px solid #e0e0e0; }
    .match-row:hover { background: #f6f6f6; }
    .match-time { font-weight: bold; width: 65px; flex-shrink: 0; }
    .match-icon { width: 40px; margin-right: 12px; flex-shrink: 0; display: flex; justify-content: center; }
    .match-icon img { width: 28px; height: 28px; object-fit: contain; }
    .match-info { flex: 1 1 260px; min-width: 0; }
    .tournament { font-weight: bold; }
    .channels { display: block; font-size: .8rem; color: #777; margin-top: 2px; }
    .watch-links { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; flex: 0 1 auto; max-width: 55%; margin-left: 10px; }
    .watch-btn { flex-shrink: 0; padding: 7px 14px; border: 0; border-radius: 6px; background: #12823e; color: #fff; font-size: .85rem; text-decoration: none; cursor: pointer; }
    .watch-btn:hover { background: #0d7338; }
    .live { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 4px; background: #d32f2f; color: #fff; font-size: .7rem; font-weight: bold; vertical-align: middle; }
    @media (max-width: 700px) {
      .watch-links { max-width: 100%; width: 100%; justify-content: flex-start; margin: 8px 0 0 0; }
    }
    .state { padding: 25px; text-align: center; color: #666; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Fútbol Libre</h1>
    <p>Agenda deportiva diaria con horarios, torneos y canales oficiales de transmisión.</p>
  </div>

  <div class="agenda-container">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Buscar equipo o torneo...">
    </div>
    <div class="agenda-header" id="agenda-date">Agenda de Partidos</div>
    <div id="matches-list"><div class="state">Cargando agenda...</div></div>
  </div>

  <script>

const API_URL = '/api/agenda';
const API_ORIGIN = ''; 
const FEED_OFFSET = '-05:00';

    const FUENTES = {};
    const FUENTES_API_URL = '';
    const PLAYER_PATH = 'player.html';
    const CAPAS = 2;

    function b64encode(text) {
      const bytes = new TextEncoder().encode(text);
      let bin = '';
      bytes.forEach(b => bin += String.fromCharCode(b));
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function extraerBase64DeUrl(url) {
      try {
        if (url.includes('?r=')) {
          const partes = url.split('?r=');
          if (partes.length > 1) {
            return partes[1].split('&')[0];
          }
        }
      } catch (e) {}
      return null;
    }

    function obtenerBase64Limpio(valor) {
      const b64Extraido = extraerBase64DeUrl(valor);
      if (b64Extraido) return b64Extraido;
      if (!/^https:\/\//i.test(valor)) return encodeURIComponent(valor);
      let v = valor;
      for (let i = 0; i < CAPAS; i++) v = b64encode(v);
      return v;
    }

    function enlaceCodificado(valor) {
      return PLAYER_PATH + '?r=' + obtenerBase64Limpio(valor);
    }

    function valorValido(u) {
      return typeof u === 'string' && u.length < 4000;
    }

    async function cargarFuentes() {
      if (!FUENTES_API_URL) return;
      try {
        const res = await fetch(FUENTES_API_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const pares = Array.isArray(data)
          ? data.map(x => [x.canal, x.url])
          : Object.entries(data || {});
        for (const [canal, url] of pares) {
          if (canal && valorValido(url)) FUENTES[norm(canal)] = url;
        }
      } catch (err) {
        console.error('No se pudieron cargar las fuentes:', err);
      }
    }

    function emojiIcon(e) {
      return 'data:image/svg+xml,' + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text x="12" y="19" font-size="19" text-anchor="middle">${e}</text></svg>`);
    }
    const FALLBACK_FLAG = emojiIcon('⚽');

    const norm = s => (s || '').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();

    const PAISES = {
      'argentina':'ar','brasil':'br','mexico':'mx','colombia':'co','peru':'pe','chile':'cl',
      'uruguay':'uy','paraguay':'py','ecuador':'ec','bolivia':'bo','venezuela':'ve',
      'espana':'es','inglaterra':'gb-eng','escocia':'gb-sct','gales':'gb-wls','italia':'it',
      'alemania':'de','francia':'fr','portugal':'pt','paises bajos':'nl','holanda':'nl',
      'belgica':'be','turquia':'tr','estados unidos':'us','eeuu':'us','usa':'us','ee.uu.':'us',
      'arabia saudita':'sa','arabia saudi':'sa','japon':'jp','china':'cn','grecia':'gr','rusia':'ru',
      'ucrania':'ua','suiza':'ch','austria':'at','croacia':'hr','serbia':'rs','polonia':'pl',
      'dinamarca':'dk','suecia':'se','noruega':'no','costa rica':'cr','panama':'pa',
      'honduras':'hn','guatemala':'gt','el salvador':'sv','jamaica':'jm','canada':'ca',
      'australia':'au','corea del sur':'kr','egipto':'eg','marruecos':'ma','sudafrica':'za',
      'qatar':'qa','catar':'qa','emiratos arabes':'ae','republica checa':'cz','rumania':'ro',
      'hungria':'hu','bulgaria':'bg','irlanda':'ie','israel':'il','cuba':'cu',
      'republica dominicana':'do','nicaragua':'ni','haiti':'ht','trinidad y tobago':'tt',
      'finlandia':'fi','eslovaquia':'sk','eslovenia':'si','chipre':'cy','islandia':'is'
    };

    const LIGAS = [
      { match: 'formula 1',         tsdb: 4370, emoji: '🏎️' },
      { match: 'nfl',               tsdb: 4391, emoji: '🏈' },
      { match: 'nba',               tsdb: 4387, emoji: '🏀' },
      { match: 'mlb',               tsdb: 4424, emoji: '⚾' },
      { match: 'nhl',               tsdb: 4380, emoji: '🏒' },
      { match: 'ufc',               emoji: '🥊' },
      { match: 'boxeo',             emoji: '🥊' },
      { match: 'motogp',            emoji: '🏍️' },
      { match: 'atp',               emoji: '🎾' },
      { match: 'wta',               emoji: '🎾' },
      { match: 'wimbledon',         emoji: '🎾' },
      { match: 'roland garros',     emoji: '🎾' },
      { match: 'rugby',             emoji: '🏉' },
      { match: 'voley',             emoji: '🏐' },
      { match: 'golf',              emoji: '⛳' },
      { match: 'ciclismo',          emoji: '🚴' },
      { match: 'champions league',  tsdb: 4480 },
      { match: 'europa league',     tsdb: 4481 },
      { match: 'libertadores',      tsdb: 4501 },
      { match: 'premier league',    flag: 'gb-eng', tsdb: 4328 },
      { match: 'laliga',            flag: 'es', tsdb: 4335 },
      { match: 'la liga',           flag: 'es', tsdb: 4335 },
      { match: 'bundesliga',        flag: 'de', tsdb: 4331 },
      { match: 'serie a',           flag: 'it', tsdb: 4332 },
      { match: 'ligue 1',           flag: 'fr', tsdb: 4334 },
      { match: 'liga mx',           flag: 'mx', tsdb: 4350 },
      { match: 'liga profesional',  flag: 'ar', tsdb: 4406 },
      { match: 'brasileirao',       flag: 'br', tsdb: 4351 },
      { match: 'mls',               flag: 'us', tsdb: 4346 },
      { match: 'liga betplay',      flag: 'co' },
      { match: 'liga 1',            flag: 'pe' },
      { match: 'eredivisie',        flag: 'nl' },
      { match: 'primeira liga',     flag: 'pt' }
    ];
    const TSDB_KEY = '123';
    const BADGE_CACHE_KEY = 'badges_v1';
    let badgeCache = {};
    try { badgeCache = JSON.parse(localStorage.getItem(BADGE_CACHE_KEY) || '{}'); } catch {}

    function ligaDe(torneo) {
      const t = norm(torneo);
      return LIGAS.find(l => t.includes(l.match)) || null;
    }

    async function cargarEscudo(id) {
      if (id in badgeCache) return badgeCache[id];
      try {
        const r = await fetch(`https://www.thesportsdb.com/api/v1/json/${TSDB_KEY}/lookupleague.php?id=${id}`);
        const j = await r.json();
        const b = j?.leagues?.[0]?.strBadge || '';
        badgeCache[id] = b ? b + '/tiny' : '';
      } catch {
        return '';
      }
      try { localStorage.setItem(BADGE_CACHE_KEY, JSON.stringify(badgeCache)); } catch {}
      return badgeCache[id];
    }

    function flagUrl(code) { return code ? `https://flagcdn.com/w40/${code}.png` : ''; }

    function normalizar(item) {
      const a = item.attributes || {};
      const desc = a.diary_description || '';
      const i = desc.indexOf(': ');
      const torneo = i > -1 ? desc.slice(0, i) : '';
      const partido = i > -1 ? desc.slice(i + 2) : desc;

      const inicio = new Date(`${a.date_diary}T${a.diary_hour}${FEED_OFFSET}`);

      const paisNombre = a.country?.data?.attributes?.name || '';
      const imgApi = a.country?.data?.attributes?.image?.data?.attributes?.url;
      const liga = ligaDe(torneo);
      const code = PAISES[norm(paisNombre)] || liga?.flag || '';

      let apiFlag = '';
      if (imgApi) apiFlag = /^https?:/i.test(imgApi) ? imgApi : API_ORIGIN + imgApi;

      const embedsData = a.embeds?.data || [];
      const canales = [];
      const enlacesDirectos = [];

      for (const e of embedsData) {
        const attr = e.attributes || {};
        const nombreCanal = (attr.embed_name || '').trim();
        const iframePath = (attr.embed_iframe || '').trim();
        const idioma = (attr.idioma || '').trim();

        if (nombreCanal && !/movil/i.test(nombreCanal) && !/op2/i.test(nombreCanal)) {
          canales.push(nombreCanal);
        }

        if (iframePath) {
          const urlFinal = /^https?:\/\//i.test(iframePath) ? iframePath : API_ORIGIN + iframePath;
          enlacesDirectos.push({
            url: urlFinal,
            nombre: nombreCanal,
            idioma: idioma,
            envivo: true
          });
        }
      }

      return {
        inicio, torneo, partido,
        pais: paisNombre,
        tsdb: liga?.tsdb || null,
        emoji: liga?.emoji || '',
        banderas: [flagUrl(code), apiFlag].filter(Boolean),
        canales: [...new Set(canales)],
        enlaces: enlacesDirectos
      };
    }

    function fuentes(m) {
      const badge = m.tsdb ? badgeCache[m.tsdb] : '';
      return [badge, ...m.banderas, m.emoji ? emojiIcon(m.emoji) : '', FALLBACK_FLAG].filter(Boolean);
    }

    function setImg(img, urls) {
      let k = 0;
      img.onerror = () => { if (++k < urls.length) img.src = urls[k]; else img.onerror = null; };
      img.src = urls[0];
    }

    function hora(d) {
      return d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    let partidos = [];

    function render(lista) {
      const cont = document.getElementById('matches-list');
      cont.innerHTML = '';
      if (!lista.length) {
        cont.innerHTML = '<div class="state">No hay partidos para mostrar.</div>';
        return;
      }
      for (const m of lista) {
        const row = document.createElement('div');
        row.className = 'match-row';

        const t = document.createElement('div');
        t.className = 'match-time';
        t.textContent = hora(m.inicio);

        const ic = document.createElement('div');
        ic.className = 'match-icon';
        const img = document.createElement('img');
        img.alt = m.torneo || m.pais; img.loading = 'lazy';
        setImg(img, fuentes(m));
        ic.appendChild(img);

        const info = document.createElement('div');
        info.className = 'match-info';
        const titulo = document.createElement('div');
        const tn = document.createElement('span');
        tn.className = 'tournament';
        tn.textContent = m.torneo ? m.torneo + ': ' : '';
        titulo.append(tn, document.createTextNode(m.partido));
        info.appendChild(titulo);
        if (m.canales.length) {
          const c = document.createElement('span');
          c.className = 'channels';
          c.textContent = 'Canales: ' + m.canales.join(' · ');
          info.appendChild(c);
        }

        row.append(t, ic, info);
        if (m.enlaces.some(e => e.envivo)) {
          const lv = document.createElement('span');
          lv.className = 'live';
          lv.textContent = 'EN VIVO';
          titulo.appendChild(lv);
        }

        // Construir la lista completa de opciones con sus nombres y Base64 limpios
        const todasLasOpciones = m.enlaces.map((e, idx) => ({
          nombre: e.nombre || (m.enlaces.length > 1 ? 'Opción ' + (idx + 1) : 'Ver'),
          r: obtenerBase64Limpio(e.url)
        }));

        const links = document.createElement('div');
        links.className = 'watch-links';

        m.enlaces.forEach((e, idx) => {
          const b = document.createElement('a');
          b.className = 'watch-btn';

          b.href = PLAYER_PATH + '?r=' + todasLasOpciones[idx].r
            + '&t=' + encodeURIComponent(m.torneo)
            + '&p=' + encodeURIComponent(m.partido)
            + '&h=' + encodeURIComponent(hora(m.inicio))
            + '&c=' + encodeURIComponent(m.canales.join(' · '))
            + '&opts=' + encodeURIComponent(JSON.stringify(todasLasOpciones));

          b.textContent = todasLasOpciones[idx].nombre;
          links.appendChild(b);
        });

        if (m.enlaces.length) row.appendChild(links);
        cont.appendChild(row);
      }
    }

    function filtrar() {
      const q = norm(document.getElementById('search').value);
      render(!q ? partidos : partidos.filter(m =>
        norm(m.partido + ' ' + m.torneo + ' ' + m.pais).includes(q)));
    }

    async function cargar() {
      try {
        const res = await fetch(API_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        await cargarFuentes();

        partidos = (json.data || []).map(normalizar)
          .filter(m => !isNaN(m.inicio))
          .sort((a, b) => a.inicio - b.inicio);

        if (partidos.length) {
          document.getElementById('agenda-date').textContent =
            'Agenda de Partidos · ' + partidos[0].inicio.toLocaleDateString('es',
              { weekday: 'long', day: 'numeric', month: 'long' });
        }
        filtrar();

        const ids = [...new Set(partidos.map(m => m.tsdb).filter(Boolean))];
        const faltan = ids.filter(id => !(id in badgeCache));
        if (faltan.length) {
          await Promise.all(faltan.map(cargarEscudo));
          filtrar();
        }
      } catch (err) {
        console.error(err);
        document.getElementById('matches-list').innerHTML =
          '<div class="state">No se pudo cargar la agenda (posible bloqueo CORS o servidor caído).</div>';
      }
    }

    document.getElementById('search').addEventListener('input', filtrar);
    cargar();
    setInterval(cargar, 5 * 60 * 1000);
  </script>
</body>
</html>
