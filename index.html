<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROJADIRECTA - Agenda Deportiva por Partidos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rojaBg: '#121212',
                        rojaRed: '#d32f2f',
                        rojaDarkRed: '#b71c1c',
                        rojaPanel: '#1e1e1e',
                        rojaHeader: '#262626'
                    }
                }
            }
        }
    </script>
    <!-- HLS.js para reproducción directa de streams .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, Helvetica, sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #d32f2f; border-radius: 3px; }
    </style>
</head>
<body class="bg-rojaBg text-gray-200 min-h-screen flex flex-col">

    <!-- Header Banner -->
    <header class="bg-gradient-to-r from-rojaDarkRed via-rojaRed to-rojaDarkRed border-b-2 border-red-700 shadow-xl px-4 py-3">
        <div class="max-w-[1100px] mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="showAgendaView()">
                <div class="bg-black text-white font-black px-2.5 py-1 text-xl tracking-tighter border border-red-500 rounded">
                    ROJA<span class="text-red-500">DIRECTA</span>
                </div>
                <span class="text-xs font-bold text-red-200 uppercase tracking-widest hidden sm:inline-block">
                    Agenda Deportiva En Vivo (Sin Publicidad)
                </span>
            </div>
            <div id="headerActions" class="flex items-center space-x-2">
                <button onclick="fetchAgendaJson()" id="btnActualizar" class="bg-black hover:bg-zinc-900 border border-red-500/50 text-white text-xs px-3 py-1.5 rounded font-bold transition flex items-center gap-1.5 shadow">
                    <i id="updateIcon" class="fa-solid fa-rotate text-red-500"></i> Actualizar
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 max-w-[1100px] w-full mx-auto p-3 md:p-5">

        <!-- VISTA 1: AGENDA -->
        <section id="agendaView" class="flex flex-col space-y-4">
            <div class="bg-rojaPanel border border-zinc-800 rounded overflow-hidden shadow-xl">
                <div class="bg-rojaHeader p-3 border-b border-zinc-800 flex flex-col sm:flex-row items-center justify-between gap-3">
                    <span class="text-sm font-bold text-red-500 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-list-ul"></i> Canales y Eventos Disponibles
                    </span>
                    <input type="text" id="searchInput" oninput="filterEvents()" placeholder="Buscar evento..." class="bg-black border border-zinc-700 rounded px-3 py-1.5 text-xs text-white outline-none focus:border-red-500 w-full sm:w-72">
                </div>
                <div id="eventsList" class="divide-y divide-zinc-800 text-xs">
                    <!-- Dinámico -->
                </div>
            </div>
        </section>

        <!-- VISTA 2: REPRODUCTOR NATIVO HLS -->
        <section id="playerView" class="hidden flex-col space-y-3">
            <div class="bg-rojaPanel border border-zinc-800 p-3 rounded flex items-center justify-between shadow-lg">
                <button onclick="showAgendaView()" class="bg-red-700 hover:bg-red-600 text-white text-xs px-4 py-2 rounded font-bold transition flex items-center gap-2 shadow">
                    <i class="fa-solid fa-arrow-left"></i> Volver
                </button>
                <div class="text-right">
                    <h2 id="currentTitle" class="text-sm md:text-base font-bold text-red-400">Título</h2>
                    <p id="currentMeta" class="text-xs text-gray-400">Reproducción Directa HLS</p>
                </div>
            </div>

            <!-- Video HTML5 Nativo (Cero anuncios) -->
            <div class="relative bg-black rounded border-2 border-zinc-800 aspect-video w-full flex items-center justify-center overflow-hidden shadow-2xl">
                <video id="videoPlayer" controls autoplay playsinline class="w-full h-full object-contain"></video>
            </div>
        </section>

    </main>

    <script>
        let rawEventsData = [];
        let hlsInstance = null;

        document.addEventListener("DOMContentLoaded", () => {
            fetchAgendaJson();
        });

        function showAgendaView() {
            document.getElementById("agendaView").classList.remove("hidden");
            document.getElementById("playerView").classList.add("hidden");
            document.getElementById("headerActions").classList.remove("hidden");
            const videoElem = document.getElementById("videoPlayer");
            videoElem.pause();
            videoElem.src = "";
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
        }

        function showPlayerView() {
            document.getElementById("agendaView").classList.add("hidden");
            document.getElementById("playerView").classList.remove("hidden");
            document.getElementById("headerActions").classList.add("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function fetchAgendaJson() {
            const icon = document.getElementById("updateIcon");
            icon.classList.add("fa-spin");

            try {
                // Carga el archivo JSON generado automáticamente por el scraper en GitHub
                const response = await fetch('agenda.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error("No se pudo cargar agenda.json");
                const data = await response.json();
                rawEventsData = data;
                renderAgenda(rawEventsData);
            } catch (error) {
                console.warn("Error cargando agenda.json, usando respaldo.", error);
                rawEventsData = [
                    { "title": "ESPN 2 (Prueba)", "link": "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", "category": "futbol" }
                ];
                renderAgenda(rawEventsData);
            } finally {
                icon.classList.remove("fa-spin");
            }
        }

        function renderAgenda(list) {
            const container = document.getElementById("eventsList");
            container.innerHTML = "";

            if (list.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-gray-500">No hay transmisiones disponibles.</div>`;
                return;
            }

            list.forEach((item, index) => {
                const matchCard = document.createElement("div");
                matchCard.className = "bg-rojaPanel p-3.5 hover:bg-zinc-800/80 transition flex items-center justify-between border-b border-zinc-800/60";
                matchCard.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="font-bold text-red-500 bg-black px-2 py-1 rounded text-xs border border-zinc-800">EN VIVO</span>
                        <h4 class="font-bold text-gray-100 text-xs md:text-sm">${escapeHtml(item.title)}</h4>
                    </div>
                    <button onclick='openStream(${JSON.stringify(item.title)}, ${JSON.stringify(item.link)})' 
                            class="bg-red-700 hover:bg-red-600 text-white px-3 py-1.5 rounded text-xs font-bold transition flex items-center gap-1.5">
                        <i class="fa-solid fa-play"></i> Ver sin anuncios
                    </button>
                `;
                container.appendChild(matchCard);
            });
        }

        function openStream(title, url) {
            document.getElementById("currentTitle").innerText = title;
            showPlayerView();

            const videoElem = document.getElementById("videoPlayer");
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            if (url.includes(".m3u8")) {
                if (Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(url);
                    hlsInstance.attachMedia(videoElem);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => videoElem.play());
                } else if (videoElem.canPlayType("application/vnd.apple.mpegurl")) {
                    videoElem.src = url;
                    videoElem.play();
                }
            } else {
                videoElem.src = url;
                videoElem.play();
            }
        }

        function filterEvents() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = rawEventsData.filter(item => item.title.toLowerCase().includes(query));
            renderAgenda(filtered);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
