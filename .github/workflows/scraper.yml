name: Auto-Scraper m3u8

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias y Playwright
      run: |
        pip install playwright
        playwright install --with-deps chromium

    - name: Ejecutar Script Scraper
      run: |
        python scraper.py

    - name: Commit y Push automático de agenda.json
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add agenda.json
        git commit -m "Actualización automática de enlaces m3u8 reales [skip ci]" || exit 0
        git push
